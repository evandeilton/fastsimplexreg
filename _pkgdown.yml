url: https://evandeilton.github.io/fastsimplexreg/

template:
  bootstrap: 5
  # The logo is natively dark, so the site offers both modes. The bootswatch
  # theme was removed: the pkgdown documentation warns that bootswatch themes
  # rarely work together with the light switch.
  light-switch: true
  # Code highlighting: the github-dark background is the same graphite as the
  # hexagon.
  theme: github-light
  theme-dark: github-dark
  bslib:
    # Logo amber darkened until it passes AA contrast on a light background
    # (the #f59e0b of the hexagon border gives ~2:1 on white and would fail).
    primary: "#b45309"
    # Hexagon graphite in the navbar, the same in both modes.
    navbar-bg: "#0d1117"
    base_font:
      google: "Source Sans 3"
    heading_font:
      google: "Source Serif 4"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/fastsimplexreg.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/evandeilton/fastsimplexreg
      aria-label: GitHub

footer:
  structure:
    left: [authors]
    right: [github]
  components:
    authors:
      text: José Evandeilton Lopes
    github:
      icon: fab fa-github
      href: https://github.com/evandeilton/fastsimplexreg
      aria-label: GitHub

articles:
  - title: "Articles"
    navbar: ~
    contents:
      - fastsimplexreg
      - fastsimplexregmixed
      - benchmark

reference:
  - title: "Model fitting"
    desc: "Fit fixed- and mixed-effects simplex regression models."
    contents:
      - fastsimplexreg
      - fastsimplexregmixed
  - title: "The simplex distribution"
    desc: >
      Density, distribution and quantile functions, random generation, and the
      mean link inverse.
    contents:
      - dsimplex
      - psimplex
      - qsimplex
      - rsimplex
      - simplex_linkinv
  - title: "S3 methods: fixed-effects fits"
    desc: "Methods for objects of class simplex_fast."
    contents:
      - simplex_fast-methods
      - summary.simplex_fast
      - print.simplex_fast
      - predict.simplex_fast
      - plot.simplex_fast
      - simulate.simplex_fast
  - title: "S3 methods: mixed-effects fits"
    desc: "Methods for objects of class simplex_fast_mixed."
    contents:
      - simplex_fast_mixed-methods
      - print.VarCorr.simplex_fast_mixed
      - summary.simplex_fast_mixed
      - print.simplex_fast_mixed
      - predict.simplex_fast_mixed
      - plot.simplex_fast_mixed
      - ngrps
      - reexports
  - title: "Package"
    contents:
      - fastsimplexreg-package
