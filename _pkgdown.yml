url: https://evandeilton.github.io/fastsimplexreg/

template:
  bootstrap: 5
  # O logo e nativamente escuro, entao o site oferece os dois modos. O tema
  # bootswatch foi removido: a documentacao do pkgdown avisa que temas
  # bootswatch dificilmente funcionam junto com o light switch.
  light-switch: true
  # Realce de codigo: o fundo do github-dark e o mesmo grafite do hexagono.
  theme: github-light
  theme-dark: github-dark
  bslib:
    # Ambar do logo escurecido ate passar em contraste AA sobre fundo claro
    # (o #f59e0b da borda do hexagono da ~2:1 sobre branco e reprovaria).
    primary: "#b45309"
    # Grafite do hexagono na navbar, igual nos dois modos.
    navbar-bg: "#0d1117"
    base_font:
      google: "Source Sans 3"
    heading_font:
      google: "Source Serif 4"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/fastsimplexreg.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/evandeilton/fastsimplexreg
      aria-label: GitHub

footer:
  structure:
    left: [authors]
    right: [github]
  components:
    authors:
      text: José Evandeilton Lopes
    github:
      icon: fab fa-github
      href: https://github.com/evandeilton/fastsimplexreg
      aria-label: GitHub

articles:
  - title: "Articles"
    navbar: ~
    contents:
      - fastsimplexreg
      - fastsimplexregmixed
      - benchmark

reference:
  - title: "Model fitting"
    desc: "Fit fixed- and mixed-effects simplex regression models."
    contents:
      - fastsimplexreg
      - fastsimplexregmixed
  - title: "The simplex distribution"
    desc: >
      Density, distribution and quantile functions, random generation, and the
      mean link inverse.
    contents:
      - dsimplex
      - psimplex
      - qsimplex
      - rsimplex
      - simplex_linkinv
  - title: "S3 methods: fixed-effects fits"
    desc: "Methods for objects of class simplex_fast."
    contents:
      - simplex_fast-methods
      - summary.simplex_fast
      - print.simplex_fast
      - predict.simplex_fast
      - plot.simplex_fast
      - simulate.simplex_fast
  - title: "S3 methods: mixed-effects fits"
    desc: "Methods for objects of class simplex_fast_mixed."
    contents:
      - simplex_fast_mixed-methods
      - print.VarCorr.simplex_fast_mixed
      - summary.simplex_fast_mixed
      - print.simplex_fast_mixed
      - predict.simplex_fast_mixed
      - plot.simplex_fast_mixed
      - ngrps
      - reexports
  - title: "Package"
    contents:
      - fastsimplexreg-package
